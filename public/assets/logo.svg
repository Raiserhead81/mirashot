<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="MIRASHOT Logo">
  <defs>
    <radialGradient id="ms-orb" cx="34%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#4a6d99"/>
      <stop offset="55%" stop-color="#2d5480"/>
      <stop offset="100%" stop-color="#1f3a5f"/>
    </radialGradient>
    <linearGradient id="ms-iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fb0d4"/>
      <stop offset="100%" stop-color="#3f6ba1"/>
    </linearGradient>
  </defs>

  <!-- Orb-Koerper -->
  <circle cx="48" cy="48" r="32" fill="url(#ms-orb)"/>
  <circle cx="48" cy="48" r="32" fill="none" stroke="#16283f" stroke-width="1.4"/>

  <!-- Glanzlicht, zurueckhaltend -->
  <ellipse cx="37" cy="33" rx="11" ry="6.5" fill="#ffffff" opacity="0.18" transform="rotate(-24 37 33)"/>

  <!-- Iris / Blende -->
  <circle cx="48" cy="48" r="16" fill="#101b2b"/>
  <circle cx="48" cy="48" r="16" fill="none" stroke="url(#ms-iris)" stroke-width="2" opacity="0.95"/>
  <g stroke="#8fb0d4" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
    <line x1="48" y1="34.5" x2="44.2" y2="44.6"/>
    <line x1="60.1" y1="42.2" x2="50.9" y2="47.4"/>
    <line x1="55.6" y1="57.8" x2="50.1" y2="49.2"/>
    <line x1="40.4" y1="57.8" x2="45.9" y2="49.2"/>
    <line x1="35.9" y1="42.2" x2="45.1" y2="47.4"/>
    <line x1="52.6" y1="35.6" x2="48.4" y2="45.4"/>
  </g>
  <circle cx="48" cy="48" r="5.4" fill="url(#ms-iris)"/>
  <circle cx="48" cy="48" r="2.1" fill="#101b2b"/>

  <!-- Blitz-Akzent, dezent -->
  <path d="M74 8 L61 30 L69.5 30 L57 54 L81 26 L72 26 Z" fill="#b98a2f" stroke="#f2e3bd" stroke-width="1.2" stroke-linejoin="round" opacity="0.95"/>
