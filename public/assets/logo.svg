<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="MIRASHOT Logo">
  <defs>
    <radialGradient id="ms-orb" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="35%" stop-color="#8b5cf6"/>
      <stop offset="75%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </radialGradient>
    <linearGradient id="ms-iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="ms-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ms-glow-sm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Aura -->
  <circle cx="48" cy="50" r="40" fill="#8b5cf6" opacity="0.18" filter="url(#ms-glow)"/>

  <!-- Orb-Koerper -->
  <circle cx="48" cy="48" r="32" fill="url(#ms-orb)"/>
  <circle cx="48" cy="48" r="32" fill="none" stroke="#e0f2fe" stroke-opacity="0.55" stroke-width="1.2"/>

  <!-- Glanzlicht -->
  <ellipse cx="37" cy="33" rx="11" ry="6.5" fill="#ffffff" opacity="0.32" transform="rotate(-24 37 33)"/>

  <!-- Iris / Blende -->
  <circle cx="48" cy="48" r="16" fill="#0b0f1a"/>
  <circle cx="48" cy="48" r="16" fill="none" stroke="url(#ms-iris)" stroke-width="2" opacity="0.9"/>
  <!-- Blendenlamellen -->
  <g stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <line x1="48" y1="34.5" x2="44.2" y2="44.6"/>
    <line x1="60.1" y1="42.2" x2="50.9" y2="47.4"/>
    <line x1="55.6" y1="57.8" x2="50.1" y2="49.2"/>
    <line x1="40.4" y1="57.8" x2="45.9" y2="49.2"/>
    <line x1="35.9" y1="42.2" x2="45.1" y2="47.4"/>
    <line x1="52.6" y1="35.6" x2="48.4" y2="45.4"/>
  </g>
  <!-- Blendenoeffnung -->
  <circle cx="48" cy="48" r="5.4" fill="url(#ms-iris)" filter="url(#ms-glow-sm)"/>
  <circle cx="48" cy="48" r="2.1" fill="#0b0f1a"/>

  <!-- Blitz-Akzent -->
  <path d="M74 8 L61 30 L69.5 30 L57 54 L81 26 L72 26 Z" fill="#fbbf24" stroke="#fff7ed" stroke-width="1.4" stroke-linejoin="round" filter="url(#ms-glow-sm)"/>
</svg>
