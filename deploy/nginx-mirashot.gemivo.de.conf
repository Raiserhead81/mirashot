# MIRASHOT — datenschutzkonforme Screenshots (Node/Express, Port 3119).
# Datenschutz: Access-Log OHNE Query-String (Format "noquery": "$request_method $uri"),
# damit die abgelichteten URLs niemals geloggt werden.
server {
    listen 80;
    listen [::]:80;
    server_name mirashot.gemivo.de;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; allow all; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mirashot.gemivo.de;

    ssl_certificate     /etc/letsencrypt/live/gemivo-tenants/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gemivo-tenants/privkey.pem;

    include snippets/gemivo-security.conf;

    client_max_body_size 15m;

    access_log /var/log/nginx/mirashot.access.log noquery;

    location / {
        proxy_pass http://127.0.0.1:3119;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
